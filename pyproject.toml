[project]
name = "prom-platinum-store"
version = "0.1.0"
description = "Модульная система управления магазинами Prom.ua"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "rich>=13,<15", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["N999"]
