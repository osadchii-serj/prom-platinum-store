[project]
name = "prom-platinum-store"
version = "0.1.0"
description = "Исследование API Prom.ua для магазина PLATINUM STORE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "rich>=13,<15", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["scripts/исследование"]

[tool.ruff.lint]
ignore = ["N999"]
