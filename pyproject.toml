[project]
name = "prom-platinum-store"
version = "0.1.0"
description = "Исследование API Prom.ua для магазина PLATINUM STORE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "rich>=13,<15",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["scripts/исследование"]

[tool.ruff.lint]
ignore = ["N999"]
